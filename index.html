<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✨ Personal Site Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6c63ff;
      --primary-dark: #5a52d5;
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #22223b;
      --text: #e8e8f0;
      --muted: #8888aa;
      --border: #2e2e4e;
      --success: #48bb78;
      --accent: #f093fb;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .builder-header {
      text-align: center;
      padding: 60px 20px 40px;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a0a2e 50%, #0f1a2e 100%);
      position: relative;
      overflow: hidden;
    }
    .builder-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(108,99,255,0.15) 0%, transparent 70%);
    }
    .builder-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      background: linear-gradient(135deg, #fff 0%, #c9c0ff 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
    }
    .builder-header p {
      color: var(--muted);
      margin-top: 12px;
      font-size: 1.05rem;
      position: relative;
    }
    .steps-bar {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-top: 36px;
      position: relative;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      transition: color 0.3s;
    }
    .step.active { color: var(--primary); }
    .step.done { color: var(--success); }
    .step-dot {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem;
      transition: all 0.3s;
    }
    .step.active .step-dot { border-color: var(--primary); background: var(--primary); color: #fff; }
    .step.done .step-dot { border-color: var(--success); background: var(--success); color: #fff; }
    .step-line {
      width: 60px; height: 2px;
      background: var(--border);
      margin: 0 4px;
      align-self: center;
      transition: background 0.3s;
    }
    .step-line.done { background: var(--success); }

    /* ── FORM CONTAINER ── */
    .form-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ── SECTION CARDS ── */
    .form-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 24px;
      transition: border-color 0.3s;
    }
    .form-section:hover { border-color: rgba(108,99,255,0.4); }
    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title span { font-size: 1.1rem; }

    /* ── FORM FIELDS ── */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media(max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    input[type="text"],
    input[type="email"],
    input[type="url"],
    textarea,
    select {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      padding: 12px 14px;
      transition: border-color 0.25s, box-shadow 0.25s;
      outline: none;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }
    textarea { resize: vertical; min-height: 90px; line-height: 1.55; }
    select option { background: #1a1a2e; }
    input::placeholder, textarea::placeholder { color: #55557a; }

    /* ── SKILLS INPUT ── */
    .skills-input-wrap { position: relative; }
    .skills-input-wrap input { padding-right: 90px; }
    .add-skill-btn {
      position: absolute;
      right: 6px; top: 50%;
      transform: translateY(-50%);
      background: var(--primary);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-skill-btn:hover { background: var(--primary-dark); }
    .skills-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      min-height: 36px;
    }
    .skill-tag {
      background: rgba(108,99,255,0.18);
      border: 1px solid rgba(108,99,255,0.35);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.82rem;
      display: flex; align-items: center; gap: 6px;
      color: #c9c0ff;
    }
    .skill-tag button {
      background: none; border: none;
      color: #8888aa; cursor: pointer;
      font-size: 0.9rem; line-height: 1;
      padding: 0; transition: color 0.2s;
    }
    .skill-tag button:hover { color: #ff6b6b; }

    /* ── COLOR THEMES ── */
    .themes-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .theme-option { display: none; }
    .theme-label {
      width: 44px; height: 44px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .theme-label:hover { transform: scale(1.1); }
    .theme-option:checked + .theme-label {
      border-color: #fff;
      transform: scale(1.15);
    }
    .theme-label::after {
      content: '✓';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #fff;
      opacity: 0;
    }
    .theme-option:checked + .theme-label::after { opacity: 1; }

    /* ── GENERATE BUTTON ── */
    .generate-btn-wrap { text-align: center; margin-top: 36px; }
    .generate-btn {
      background: linear-gradient(135deg, var(--primary), #9c27b0);
      border: none;
      border-radius: 50px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 16px 48px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 30px rgba(108,99,255,0.35);
    }
    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(108,99,255,0.5);
    }
    .generate-btn:active { transform: translateY(0); }

    /* ── PREVIEW OVERLAY ── */
    #preview-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    #preview-overlay.open { display: flex; flex-direction: column; }
    .preview-toolbar {
      background: #0a0a14;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e1e3a;
      flex-shrink: 0;
    }
    .preview-toolbar-left {
      display: flex; align-items: center; gap: 12px;
    }
    .browser-dots { display: flex; gap: 6px; }
    .browser-dot {
      width: 12px; height: 12px; border-radius: 50%;
    }
    .dot-red { background: #ff5f57; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #28c940; }
    .fake-url {
      background: #1a1a2e;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      min-width: 240px;
    }
    .preview-actions { display: flex; gap: 10px; }
    .preview-btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 16px;
      transition: opacity 0.2s;
    }
    .preview-btn:hover { opacity: 0.85; }
    .btn-open { background: var(--primary); color: #fff; }
    .btn-close { background: #2e2e4e; color: var(--text); }
    #preview-frame {
      flex: 1;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="builder-header">
  <h1>✨ Personal Site Builder</h1>
  <p>Fill in your details below and get a beautiful personalized website instantly</p>
  <div class="steps-bar">
    <div class="step active">
      <div class="step-dot">1</div>
      <span>Your Info</span>
    </div>
    <div class="step-line" id="line1"></div>
    <div class="step" id="step2">
      <div class="step-dot">2</div>
      <span>Skills & Work</span>
    </div>
    <div class="step-line" id="line2"></div>
    <div class="step" id="step3">
      <div class="step-dot">3</div>
      <span>Preview & Launch</span>
    </div>
  </div>
</div>

<!-- FORM -->
<div class="form-container">
  <form id="siteForm" onsubmit="generateSite(event)">

    <!-- PERSONAL INFO -->
    <div class="form-section">
      <div class="section-title"><span>👤</span> Personal Information</div>
      <div class="form-row">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="name" placeholder="e.g. Alex Johnson" required />
        </div>
        <div class="form-group">
          <label>Your Title / Role *</label>
          <input type="text" id="role" placeholder="e.g. Full Stack Developer" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="alex@example.com" />
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="location" placeholder="e.g. San Francisco, CA" />
        </div>
        <div class="form-group full">
          <label>Profile Photo URL</label>
          <input type="url" id="photo" placeholder="https://your-photo-url.com/photo.jpg" />
        </div>
        <div class="form-group full">
          <label>About Me *</label>
          <textarea id="about" placeholder="Write a short bio about yourself, your passions, and what you do..." required></textarea>
        </div>
      </div>
    </div>

    <!-- SKILLS -->
    <div class="form-section">
      <div class="section-title"><span>🚀</span> Skills & Technologies</div>
      <div class="form-group">
        <label>Add Skills</label>
        <div class="skills-input-wrap">
          <input type="text" id="skillInput" placeholder="Type a skill and press Add or Enter" onkeydown="if(event.key==='Enter'){event.preventDefault();addSkill()}" />
          <button type="button" class="add-skill-btn" onclick="addSkill()">+ Add</button>
        </div>
        <div class="skills-tags" id="skillsTags"></div>
      </div>
    </div>

    <!-- EXPERIENCE / PROJECTS -->
    <div class="form-section">
      <div class="section-title"><span>💼</span> Experience & Projects</div>
      <div class="form-row">
        <div class="form-group full">
          <label>Featured Project / Achievement 1</label>
          <input type="text" id="proj1title" placeholder="Project Title" />
        </div>
        <div class="form-group full">
          <label>Description</label>
          <textarea id="proj1desc" placeholder="What did you build or achieve?" style="min-height:70px;"></textarea>
        </div>
        <div class="form-group full">
          <label>Featured Project / Achievement 2</label>
          <input type="text" id="proj2title" placeholder="Project Title" />
        </div>
        <div class="form-group full">
          <label>Description</label>
          <textarea id="proj2desc" placeholder="What did you build or achieve?" style="min-height:70px;"></textarea>
        </div>
        <div class="form-group full">
          <label>Years of Experience</label>
          <input type="text" id="experience" placeholder="e.g. 5+ years" />
        </div>
      </div>
    </div>

    <!-- SOCIAL LINKS -->
    <div class="form-section">
      <div class="section-title"><span>🔗</span> Social & Contact Links</div>
      <div class="form-row">
        <div class="form-group">
          <label>GitHub URL</label>
          <input type="url" id="github" placeholder="https://github.com/username" />
        </div>
        <div class="form-group">
          <label>LinkedIn URL</label>
          <input type="url" id="linkedin" placeholder="https://linkedin.com/in/username" />
        </div>
        <div class="form-group">
          <label>Twitter / X URL</label>
          <input type="url" id="twitter" placeholder="https://twitter.com/username" />
        </div>
        <div class="form-group">
          <label>Portfolio / Website</label>
          <input type="url" id="website" placeholder="https://yourwebsite.com" />
        </div>
      </div>
    </div>

    <!-- THEME -->
    <div class="form-section">
      <div class="section-title"><span>🎨</span> Choose Your Theme Color</div>
      <div class="themes-grid">
        <input type="radio" name="theme" id="th-purple" value="purple" class="theme-option" checked />
        <label class="theme-label" for="th-purple" style="background: linear-gradient(135deg,#6c63ff,#9c27b0);" title="Purple"></label>

        <input type="radio" name="theme" id="th-blue" value="blue" class="theme-option" />
        <label class="theme-label" for="th-blue" style="background: linear-gradient(135deg,#1a73e8,#00bcd4);" title="Blue"></label>

        <input type="radio" name="theme" id="th-green" value="green" class="theme-option" />
        <label class="theme-label" for="th-green" style="background: linear-gradient(135deg,#00c851,#007e33);" title="Green"></label>

        <input type="radio" name="theme" id="th-orange" value="orange" class="theme-option" />
        <label class="theme-label" for="th-orange" style="background: linear-gradient(135deg,#ff6b35,#f7c59f);" title="Orange"></label>

        <input type="radio" name="theme" id="th-pink" value="pink" class="theme-option" />
        <label class="theme-label" for="th-pink" style="background: linear-gradient(135deg,#e91e8c,#f093fb);" title="Pink"></label>

        <input type="radio" name="theme" id="th-red" value="red" class="theme-option" />
        <label class="theme-label" for="th-red" style="background: linear-gradient(135deg,#e53935,#ff7043);" title="Red"></label>

        <input type="radio" name="theme" id="th-teal" value="teal" class="theme-option" />
        <label class="theme-label" for="th-teal" style="background: linear-gradient(135deg,#00897b,#4db6ac);" title="Teal"></label>

        <input type="radio" name="theme" id="th-gold" value="gold" class="theme-option" />
        <label class="theme-label" for="th-gold" style="background: linear-gradient(135deg,#f5a623,#f8e71c);" title="Gold"></label>
      </div>
    </div>

    <div class="generate-btn-wrap">
      <button type="submit" class="generate-btn">🚀 Generate My Website</button>
    </div>
  </form>
</div>

<!-- PREVIEW OVERLAY -->
<div id="preview-overlay">
  <div class="preview-toolbar">
    <div class="preview-toolbar-left">
      <div class="browser-dots">
        <div class="browser-dot dot-red"></div>
        <div class="browser-dot dot-yellow"></div>
        <div class="browser-dot dot-green"></div>
      </div>
      <div class="fake-url" id="previewUrl">🔒 yourname.mysite.com</div>
    </div>
    <div class="preview-actions">
      <button class="preview-btn btn-open" onclick="openInNewTab()">⬆ Open in New Tab</button>
      <button class="preview-btn btn-close" onclick="closePreview()">✕ Close</button>
    </div>
  </div>
  <iframe id="preview-frame" title="Your Generated Website"></iframe>
</div>

<script>
  /* ── SKILLS MANAGEMENT ── */
  let skills = [];

  function addSkill() {
    const inp = document.getElementById('skillInput');
    const val = inp.value.trim();
    if (!val || skills.includes(val)) { inp.value = ''; return; }
    skills.push(val);
    renderSkills();
    inp.value = '';
    inp.focus();
  }

  function removeSkill(s) {
    skills = skills.filter(x => x !== s);
    renderSkills();
  }

  function renderSkills() {
    const container = document.getElementById('skillsTags');
    container.innerHTML = skills.map(s =>
      `<span class="skill-tag">${s} <button type="button" onclick="removeSkill('${s.replace(/'/g,"\\'")}')">×</button></span>`
    ).join('');
  }

  /* ── THEME PALETTE MAP ── */
  const themeMap = {
    purple: { primary: '#6c63ff', secondary: '#9c27b0', grad: 'linear-gradient(135deg,#6c63ff,#9c27b0)', glow: 'rgba(108,99,255,0.4)' },
    blue:   { primary: '#1a73e8', secondary: '#00bcd4', grad: 'linear-gradient(135deg,#1a73e8,#00bcd4)', glow: 'rgba(26,115,232,0.4)' },
    green:  { primary: '#00c851', secondary: '#007e33', grad: 'linear-gradient(135deg,#00c851,#007e33)', glow: 'rgba(0,200,81,0.4)' },
    orange: { primary: '#ff6b35', secondary: '#f7931e', grad: 'linear-gradient(135deg,#ff6b35,#f7c59f)', glow: 'rgba(255,107,53,0.4)' },
    pink:   { primary: '#e91e8c', secondary: '#f093fb', grad: 'linear-gradient(135deg,#e91e8c,#f093fb)', glow: 'rgba(233,30,140,0.4)' },
    red:    { primary: '#e53935', secondary: '#ff7043', grad: 'linear-gradient(135deg,#e53935,#ff7043)', glow: 'rgba(229,57,53,0.4)' },
    teal:   { primary: '#00897b', secondary: '#4db6ac', grad: 'linear-gradient(135deg,#00897b,#4db6ac)', glow: 'rgba(0,137,123,0.4)' },
    gold:   { primary: '#f5a623', secondary: '#f8e71c', grad: 'linear-gradient(135deg,#f5a623,#f8e71c)', glow: 'rgba(245,166,35,0.4)' },
  };

  /* ── MAIN GENERATOR ── */
  function generateSite(e) {
    e.preventDefault();
    const g = id => document.getElementById(id).value.trim();
    const theme = document.querySelector('input[name="theme"]:checked').value;
    const t = themeMap[theme];

    const data = {
      name: g('name'), role: g('role'), about: g('about'),
      email: g('email'), location: g('location'), photo: g('photo'),
      github: g('github'), linkedin: g('linkedin'),
      twitter: g('twitter'), website: g('website'),
      proj1title: g('proj1title'), proj1desc: g('proj1desc'),
      proj2title: g('proj2title'), proj2desc: g('proj2desc'),
      experience: g('experience'), skills, theme: t
    };

    const html = buildHTML(data);
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);

    document.getElementById('preview-frame').src = url;
    document.getElementById('previewUrl').textContent =
      `🔒 ${data.name.toLowerCase().replace(/\s+/g,'-')}.mysite.com`;
    window._generatedUrl = url;
    window._generatedHtml = html;

    document.getElementById('preview-overlay').classList.add('open');
  }

  function openInNewTab() {
    window.open(window._generatedUrl, '_blank');
  }

  function closePreview() {
    document.getElementById('preview-overlay').classList.remove('open');
  }

  /* ── HTML TEMPLATE BUILDER ── */
  function buildHTML(d) {
    const { name, role, about, email, location, photo, github, linkedin,
            twitter, website, proj1title, proj1desc, proj2title, proj2desc,
            experience, skills, theme: t } = d;

    const initials = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);

    const avatarSection = photo
      ? `<img src="${photo}" alt="${name}" class="avatar" onerror="this.style.display='none';document.getElementById('avatar-fallback').style.display='flex';"/><div id="avatar-fallback" class="avatar-fallback" style="display:none">${initials}</div>`
      : `<div class="avatar-fallback">${initials}</div>`;

    const socialLinks = [
      github   && `<a href="${github}"   target="_blank" class="social-btn">GitHub</a>`,
      linkedin && `<a href="${linkedin}" target="_blank" class="social-btn">LinkedIn</a>`,
      twitter  && `<a href="${twitter}"  target="_blank" class="social-btn">Twitter</a>`,
      website  && `<a href="${website}"  target="_blank" class="social-btn">Portfolio</a>`,
    ].filter(Boolean).join('\n');

    const skillItems = skills.length
      ? skills.map(s => `<span class="skill-pill">${s}</span>`).join('')
      : '';

    const proj1 = proj1title ? `
      <div class="project-card">
        <div class="proj-icon">🚀</div>
        <h3>${proj1title}</h3>
        ${proj1desc ? `<p>${proj1desc}</p>` : ''}
      </div>` : '';

    const proj2 = proj2title ? `
      <div class="project-card">
        <div class="proj-icon">💡</div>
        <h3>${proj2title}</h3>
        ${proj2desc ? `<p>${proj2desc}</p>` : ''}
      </div>` : '';

    const statsSection = (experience || location || email) ? `
      <div class="stats-row">
        ${experience ? `<div class="stat-item"><span class="stat-num">${experience}</span><span class="stat-label">Experience</span></div>` : ''}
        ${skills.length ? `<div class="stat-item"><span class="stat-num">${skills.length}+</span><span class="stat-label">Technologies</span></div>` : ''}
        ${location ? `<div class="stat-item"><span class="stat-num">📍</span><span class="stat-label">${location}</span></div>` : ''}
      </div>` : '';

    const contactSection = email ? `
      <section class="section contact-section" id="contact">
        <h2 class="section-title">Get In Touch</h2>
        <p class="contact-sub">I'm always open to discussing new projects, ideas or opportunities.</p>
        <a href="mailto:${email}" class="cta-btn">✉ Send Me an Email</a>
      </section>` : '';

    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>${name} — ${role}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --p: ${t.primary};
  --s: ${t.secondary};
  --grad: ${t.grad};
  --glow: ${t.glow};
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', sans-serif;
  background: #08080f;
  color: #e0e0f0;
  overflow-x: hidden;
}
/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(8,8,15,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  padding: 0 40px;
  display: flex; align-items: center; justify-content: space-between;
  height: 62px;
}
.nav-brand {
  font-weight: 800;
  font-size: 1.1rem;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-decoration: none;
}
.nav-links { display: flex; gap: 28px; list-style: none; }
.nav-links a {
  color: rgba(255,255,255,0.6);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 500;
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--p); }

/* HERO */
.hero {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 80px 20px 40px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 50% at 50% 30%, ${t.glow} 0%, transparent 70%);
  pointer-events: none;
}
.hero-bg-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
}
.avatar-wrap { position: relative; margin-bottom: 28px; }
.avatar {
  width: 120px; height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid transparent;
  background: var(--grad) border-box;
  box-shadow: 0 0 40px var(--glow);
}
.avatar-fallback {
  width: 120px; height: 120px;
  border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; font-weight: 800; color: #fff;
  box-shadow: 0 0 40px var(--glow);
  margin: 0 auto;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.7);
  margin-bottom: 20px;
  animation: fadeDown 0.6s ease forwards;
}
.hero-badge::before { content: '●'; color: var(--p); font-size: 0.6rem; }
h1.hero-name {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.5rem, 7vw, 5rem);
  line-height: 1.1;
  font-weight: 800;
  background: linear-gradient(135deg, #fff 40%, rgba(255,255,255,0.55) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 14px;
  animation: fadeDown 0.7s ease forwards;
}
.hero-role {
  font-size: clamp(1rem, 2.5vw, 1.35rem);
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
  margin-bottom: 20px;
  animation: fadeDown 0.8s ease forwards;
}
.hero-about {
  max-width: 620px;
  color: rgba(255,255,255,0.55);
  line-height: 1.7;
  font-size: 1rem;
  margin-bottom: 32px;
  animation: fadeDown 0.9s ease forwards;
}
.hero-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; animation: fadeDown 1s ease forwards; }
.cta-btn {
  background: var(--grad);
  border: none;
  border-radius: 50px;
  color: #fff;
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  padding: 14px 32px;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 6px 24px var(--glow);
  transition: transform 0.2s, box-shadow 0.2s;
}
.cta-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 32px var(--glow); }
.cta-btn-outline {
  background: transparent;
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 50px;
  color: rgba(255,255,255,0.75);
  font-family: 'Inter', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 13px 32px;
  text-decoration: none;
  transition: border-color 0.2s, color 0.2s;
}
.cta-btn-outline:hover { border-color: var(--p); color: #fff; }

/* SCROLL INDICATOR */
.scroll-hint {
  margin-top: 60px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: rgba(255,255,255,0.25);
  font-size: 0.75rem;
  animation: fadeDown 1.2s ease forwards;
}
.scroll-arrow { width: 20px; height: 20px; border-right: 2px solid; border-bottom: 2px solid; transform: rotate(45deg); animation: bounce 1.5s infinite; }

/* STATS */
.stats-row {
  display: flex; gap: 32px; justify-content: center; flex-wrap: wrap;
  margin: 0 auto 0;
  padding: 40px 20px;
  max-width: 700px;
}
.stat-item { text-align: center; }
.stat-num { display: block; font-size: 2rem; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.stat-label { font-size: 0.82rem; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; display: block; }

/* SECTIONS */
.section {
  max-width: 900px;
  margin: 0 auto;
  padding: 80px 24px;
}
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.6rem, 4vw, 2.2rem);
  font-weight: 700;
  text-align: center;
  margin-bottom: 12px;
  color: #fff;
}
.section-line {
  width: 60px; height: 3px;
  background: var(--grad);
  border-radius: 2px;
  margin: 0 auto 44px;
}

/* SKILLS */
.skills-cloud {
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
}
.skill-pill {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  padding: 8px 20px;
  font-size: 0.9rem;
  font-weight: 500;
  color: rgba(255,255,255,0.8);
  transition: all 0.2s;
}
.skill-pill:hover {
  background: var(--p);
  border-color: var(--p);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 4px 16px var(--glow);
}

/* PROJECTS */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}
.project-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 28px;
  transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
}
.project-card:hover {
  transform: translateY(-4px);
  border-color: var(--p);
  box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px var(--glow);
}
.proj-icon { font-size: 2rem; margin-bottom: 16px; }
.project-card h3 {
  font-size: 1.1rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 10px;
}
.project-card p { color: rgba(255,255,255,0.5); line-height: 1.65; font-size: 0.92rem; }

/* SOCIAL BUTTONS */
.social-links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.social-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 10px 22px;
  color: rgba(255,255,255,0.75);
  text-decoration: none;
  font-size: 0.88rem;
  font-weight: 600;
  transition: all 0.2s;
}
.social-btn:hover { background: var(--p); border-color: var(--p); color: #fff; transform: translateY(-2px); }

/* CONTACT SECTION */
.contact-section { text-align: center; }
.contact-sub { color: rgba(255,255,255,0.45); margin-bottom: 28px; font-size: 1rem; max-width: 440px; margin-left: auto; margin-right: auto; }

/* FOOTER */
footer {
  text-align: center;
  padding: 32px 20px;
  border-top: 1px solid rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.25);
  font-size: 0.82rem;
}
footer span { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

/* DIVIDER */
.section-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  max-width: 900px;
  margin: 0 auto;
}

/* ANIMATIONS */
@keyframes fadeDown {
  from { opacity:0; transform:translateY(-16px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes bounce {
  0%,100% { transform:rotate(45deg) translateY(0); }
  50%      { transform:rotate(45deg) translateY(5px); }
}

/* Scroll-reveal via IntersectionObserver */
.reveal { opacity:0; transform:translateY(30px); transition:opacity 0.6s ease, transform 0.6s ease; }
.reveal.visible { opacity:1; transform:none; }

@media(max-width:600px){
  nav { padding: 0 20px; }
  .nav-links { gap: 16px; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-brand" href="#hero">${name.split(' ')[0]}</a>
  <ul class="nav-links">
    ${skills.length ? `<li><a href="#skills">Skills</a></li>` : ''}
    ${(proj1title||proj2title) ? `<li><a href="#projects">Projects</a></li>` : ''}
    ${email ? `<li><a href="#contact">Contact</a></li>` : ''}
  </ul>
</nav>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-bg-grid"></div>
  <div class="avatar-wrap">${avatarSection}</div>
  <div class="hero-badge">Available for opportunities</div>
  <h1 class="hero-name">${name}</h1>
  <p class="hero-role">${role}</p>
  <p class="hero-about">${about}</p>
  <div class="hero-btns">
    ${email ? `<a class="cta-btn" href="#contact">Get In Touch</a>` : ''}
    ${(proj1title||proj2title) ? `<a class="cta-btn-outline" href="#projects">View My Work</a>` : ''}
  </div>
  ${socialLinks ? `<div class="social-links" style="margin-top:28px;">${socialLinks}</div>` : ''}
  <div class="scroll-hint">
    <span>Scroll down</span>
    <div class="scroll-arrow"></div>
  </div>
</section>

${statsSection}

<!-- SKILLS -->
${skills.length ? `
<div class="section-divider"></div>
<section class="section reveal" id="skills">
  <h2 class="section-title">Skills & Technologies</h2>
  <div class="section-line"></div>
  <div class="skills-cloud">${skillItems}</div>
</section>
` : ''}

<!-- PROJECTS -->
${(proj1title||proj2title) ? `
<div class="section-divider"></div>
<section class="section reveal" id="projects">
  <h2 class="section-title">Featured Projects</h2>
  <div class="section-line"></div>
  <div class="projects-grid">${proj1}${proj2}</div>
</section>
` : ''}

<!-- CONTACT -->
${contactSection}

<!-- FOOTER -->
<footer>
  <p>Crafted with ❤️ by <span>${name}</span> · Built with Personal Site Builder</p>
</footer>

<script>
  // Scroll-reveal
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
<\/script>
</body>
</html>`;
  }
</script>
</body>
</html>
